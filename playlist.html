<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist-Wünsche ☕️🎵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#2b1c14;
    --roast:#4a3123;
    --crema:#f3e6d3;
    --paper:#faf3e8;
    --clay:#b5583a;
    --ink:#3a2a1e;
    --line: rgba(43,28,20,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(181,88,58,0.10), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  header{
    background:var(--espresso);
    color:var(--crema);
    padding:48px 24px 64px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:24px;
    background:var(--paper);
    clip-path: polygon(0 100%, 4% 20%, 8% 100%, 12% 15%, 16% 100%, 20% 25%, 24% 100%, 28% 10%, 32% 100%, 36% 30%, 40% 100%, 44% 15%, 48% 100%, 52% 20%, 56% 100%, 60% 10%, 64% 100%, 68% 25%, 72% 100%, 76% 15%, 80% 100%, 84% 20%, 88% 100%, 92% 10%, 96% 100%, 100% 25%, 100% 100%);
  }
  .steam{
    position:absolute; top:10px; font-size:22px; opacity:0.35;
    animation: rise 5s ease-in-out infinite;
  }
  .steam.s1{left:38%; animation-delay:0s;}
  .steam.s2{left:52%; animation-delay:1.6s;}
  .steam.s3{left:46%; animation-delay:3.1s;}
  @keyframes rise{
    0%{transform:translateY(0) scale(1); opacity:0;}
    20%{opacity:0.35;}
    100%{transform:translateY(-40px) scale(1.3); opacity:0;}
  }
  h1{
    font-family:'Caveat', cursive;
    font-size:clamp(2.6rem, 6vw, 4rem);
    margin:0 0 6px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  header p{
    font-family:'Fraunces', serif;
    font-size:1.05rem;
    opacity:0.85;
    margin:0;
    font-style:italic;
  }
  main{
    max-width:640px;
    margin:-40px auto 0;
    padding:0 20px 120px;
    position:relative;
    z-index:2;
  }
  .status-bar{
    text-align:center;
    font-size:0.85rem;
    color:var(--roast);
    opacity:0.7;
    margin-bottom:18px;
    min-height:18px;
  }
  .track{
    background:var(--crema);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:14px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .track .disc{
    flex:none;
    width:40px; height:40px;
    border-radius:50%;
    background:
      radial-gradient(circle at center, var(--paper) 0 6px, var(--espresso) 7px 8px, var(--roast) 9px 20px);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .track .info{ flex:1; min-width:0; }
  .track .title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.05rem;
    color:var(--ink);
    overflow-wrap:break-word;
  }
  .track .artist{
    font-size:0.88rem;
    color:var(--roast);
    opacity:0.75;
    margin-top:2px;
  }
  .track .num{
    font-family:'Fraunces', serif;
    font-size:0.8rem;
    color:var(--clay);
    opacity:0.6;
    flex:none;
  }
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--roast);
    opacity:0.6;
    font-family:'Fraunces', serif;
    font-style:italic;
  }
  .fab{
    position:fixed;
    right:22px;
    bottom:26px;
    width:60px; height:60px;
    border-radius:50%;
    background:var(--clay);
    color:var(--paper);
    border:none;
    font-size:30px;
    line-height:60px;
    text-align:center;
    box-shadow:0 8px 20px rgba(181,88,58,0.4);
    cursor:pointer;
    z-index:10;
    transition: transform 0.15s ease;
  }
  .fab:active{ transform:scale(0.92); }
  .fab:focus-visible, button:focus-visible, input:focus-visible{
    outline:3px solid var(--clay);
    outline-offset:2px;
  }
  .overlay{
    position:fixed; inset:0;
    background:rgba(43,28,20,0.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:20;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .overlay.open .sheet{ transform:translateY(0); }
  .sheet{
    background:var(--paper);
    width:100%;
    max-width:640px;
    border-radius:22px 22px 0 0;
    padding:28px 24px 32px;
    transform:translateY(20px);
    transition:transform 0.25s ease;
  }
  .sheet h2{
    font-family:'Fraunces', serif;
    margin:0 0 14px;
    font-size:1.4rem;
    color:var(--espresso);
  }
  .sheet p{
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    color:var(--roast);
    line-height:1.45;
  }
  label{
    display:block;
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--roast);
    margin:16px 0 6px;
  }
  label:first-of-type{ margin-top:4px; }
  input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Inter', sans-serif;
    font-size:1rem;
    color:var(--ink);
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .btn.confirm{ background:var(--clay); color:var(--paper); }
  .btn.cancel{ background:transparent; color:var(--roast); border:1px solid var(--line); }

  .login-screen{
    position:fixed; inset:0;
    background:var(--espresso);
    color:var(--crema);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
  }
  .login-card{
    max-width:380px;
    width:100%;
    text-align:center;
  }
  .login-card h1{
    font-family:'Caveat', cursive;
    font-size:3rem;
    margin:0 0 4px;
  }
  .login-card p{
    font-family:'Fraunces', serif;
    font-style:italic;
    opacity:0.8;
    margin:0 0 26px;
  }
  .login-card label{
    color:var(--crema);
    text-align:left;
    opacity:0.85;
  }
  .login-card input{
    background:rgba(250,243,232,0.08);
    border:1px solid rgba(250,243,232,0.25);
    color:var(--crema);
  }
  .login-card input::placeholder{ color:rgba(250,243,232,0.4); }
  .login-card .btn.confirm{
    width:100%;
    margin-top:24px;
  }
  .login-error{
    color:#e7a48c;
    font-size:0.85rem;
    margin-top:10px;
    min-height:16px;
  }
  .whoami{
    text-align:center;
    font-size:0.8rem;
    color:var(--roast);
    opacity:0.55;
    margin-bottom:10px;
  }
  .whoami button{
    background:none;
    border:none;
    color:var(--clay);
    text-decoration:underline;
    cursor:pointer;
    font-size:0.8rem;
    padding:0;
  }
  .admin-badge{
    display:inline-block;
    background:var(--clay);
    color:var(--paper);
    font-size:0.7rem;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .guest-group{
    margin-bottom:22px;
  }
  .guest-group h3{
    font-family:'Fraunces', serif;
    font-size:1rem;
    color:var(--espresso);
    margin:0 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .limit-note{
    font-size:0.85rem;
    color:var(--roast);
    opacity:0.75;
    margin:12px 0 0;
    text-align:center;
  }
  .bonus-field{
    margin-top:6px;
  }
  .bonus-field.hidden{ display:none; }
  .hidden{ display:none; }
  .btn.confirm:disabled{ opacity:0.5; cursor:not-allowed; }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Playlist-Wünsche</h1>
    <p>Was soll auf der Party laufen? ☕🎶</p>
    <label for="nameInput">Dein Name</label>
    <input id="nameInput" type="text" placeholder="z. B. Mia" maxlength="40" autocomplete="off">
    <label for="pinInput">Deine PIN (4-stellig, frei wählbar)</label>
    <input id="pinInput" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="z. B. 4711" maxlength="4" autocomplete="off">
    <div class="login-error" id="loginError"></div>
    <button class="btn confirm" id="loginBtn">Loslegen</button>
  </div>
</div>

<header>
  <span class="steam s1">☁︎</span>
  <span class="steam s2">☁︎</span>
  <span class="steam s3">☁︎</span>
  <h1 id="headerTitle">Playlist-Wünsche</h1>
  <p id="headerSub">Was soll auf der Party laufen? Trag deinen Song ein ☕🎶</p>
</header>

<main>
  <div class="status-bar" id="statusBar">verbinde …</div>
  <div class="whoami" id="whoami" style="display:none;"></div>
  <div id="list"></div>
  <div class="limit-note" id="limitNote"></div>
</main>

<button class="fab" id="fabBtn" aria-label="Song hinzufügen">+</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div id="bonusStep" class="hidden">
      <h2>Limit erreicht</h2>
      <p class="limit-note" style="margin:0 0 4px; text-align:left;">Du hast dein Songlimit erreicht. Gib die Sonder-PIN vom Gastgeber ein, um weiterzumachen.</p>
      <label for="bonusPinInput">Sonder-PIN</label>
      <input id="bonusPinInput" type="text" placeholder="Sonder-PIN" maxlength="10" autocomplete="off">
      <div class="sheet-actions">
        <button class="btn cancel" id="bonusCancelBtn">Abbrechen</button>
        <button class="btn confirm" id="bonusConfirmBtn">Weiter</button>
      </div>
    </div>
    <div id="songStep">
      <h2>Songwunsch eintragen</h2>
      <label for="titleInput">Songtitel</label>
      <input id="titleInput" type="text" placeholder="z. B. Sweet Dreams" maxlength="120" autocomplete="off">
      <label for="artistInput">Künstler</label>
      <input id="artistInput" type="text" placeholder="z. B. Eurythmics" maxlength="120" autocomplete="off">
      <div class="sheet-actions">
        <button class="btn cancel" id="cancelBtn">Abbrechen</button>
        <button class="btn confirm" id="confirmBtn">Bestätigen</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<script>
(function(){
  const ABLY_KEY = "IUC-Ig.qxmWMQ:chvGoEpWoIoa1DjOt7o2TM5FLzKUhlJqAJTGXAY8ECs";
  const CHANNEL_NAME = "playlist-geburtstag-2026";
  const STORAGE_KEY = "playlist_wunsch_identity";
  const DEFAULT_LIMIT = 3;

  const isAdmin = new URLSearchParams(window.location.search).get('admin') === '1';

  const statusBar = document.getElementById('statusBar');
  const listEl = document.getElementById('list');
  const limitNote = document.getElementById('limitNote');
  const fabBtn = document.getElementById('fabBtn');
  const overlay = document.getElementById('overlay');
  const bonusStep = document.getElementById('bonusStep');
  const songStep = document.getElementById('songStep');
  const bonusCancelBtn = document.getElementById('bonusCancelBtn');
  const bonusConfirmBtn = document.getElementById('bonusConfirmBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const confirmBtn = document.getElementById('confirmBtn');
  const titleInput = document.getElementById('titleInput');
  const artistInput = document.getElementById('artistInput');
  const bonusPinInput = document.getElementById('bonusPinInput');
  const loginScreen = document.getElementById('loginScreen');
  const nameInput = document.getElementById('nameInput');
  const pinInput = document.getElementById('pinInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const whoami = document.getElementById('whoami');
  const headerTitle = document.getElementById('headerTitle');
  const headerSub = document.getElementById('headerSub');

  let currentName = null;
  let currentPin = null;
  let tracks = []; // {id, title, artist, ts, guestName, guestPin}
  let globalLimit = DEFAULT_LIMIT;
  // pinResets: map guestKey(name, oldPin-independent by name) -> latest valid pin per name (lowercased)
  let pinByName = {}; // nameLower -> current valid pin (last reset wins; original login pin used until reset)
  let bonusGrants = []; // {id, nameLower, bonusPin, bonusCount, ts, usedBy: [guestKey,...]}

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function nameKey(name){
    return (name || '').trim().toLowerCase();
  }

  function guestKey(name, pin){
    return nameKey(name) + '|' + pin;
  }

  // --- Admin mode: skip login, show everything grouped by guest ---
  if(isAdmin){
    loginScreen.style.display = 'none';
    fabBtn.style.display = 'none';
    headerTitle.textContent = 'Alle Wünsche';
    headerSub.textContent = 'Owner-Ansicht – nur für dich sichtbar';
    whoami.style.display = 'block';
    whoami.innerHTML = '<span class="admin-badge">Admin-Ansicht</span>';
  }

  function renderAdmin(){
    if(tracks.length === 0){
      listEl.innerHTML = '<div class="empty">Noch keine Wünsche eingetragen ☕</div>';
      return;
    }
    const groups = {};
    tracks.forEach(t => {
      const g = t.guestName || 'Unbekannt';
      if(!groups[g]) groups[g] = [];
      groups[g].push(t);
    });
    const names = Object.keys(groups).sort((a,b)=> a.localeCompare(b));
    listEl.innerHTML = names.map(name => {
      const items = groups[name].sort((a,b)=> a.ts - b.ts);
      return `
        <div class="guest-group">
          <h3>${escapeHtml(name)} (${items.length})</h3>
          ${items.map(t => `
            <div class="track">
              <div class="disc"></div>
              <div class="info">
                <div class="title">${escapeHtml(t.title)}</div>
                <div class="artist">${escapeHtml(t.artist)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
  }

  function getEffectiveLimitFor(name, pin){
    let limit = globalLimit;
    bonusGrants.forEach(g => {
      if(g.nameLower === nameKey(name) && g.usedBy && g.usedBy.includes(guestKey(name, pin))){
        limit += g.bonusCount;
      }
    });
    return limit;
  }

  function renderGuest(){
    const mine = tracks.filter(t => guestKey(t.guestName, t.guestPin) === guestKey(currentName, currentPin));
    if(mine.length === 0){
      listEl.innerHTML = '<div class="empty">Du hast noch keine Wünsche eingetragen ☕</div>';
    }else{
      const sorted = [...mine].sort((a,b)=> a.ts - b.ts);
      listEl.innerHTML = sorted.map((t, i) => `
        <div class="track">
          <div class="disc"></div>
          <div class="info">
            <div class="title">${escapeHtml(t.title)}</div>
            <div class="artist">${escapeHtml(t.artist)}</div>
          </div>
          <div class="num">#${i+1}</div>
        </div>
      `).join('');
    }
    if(currentName){
      const limit = getEffectiveLimitFor(currentName, currentPin);
      limitNote.textContent = `${mine.length} von ${limit} Songs verwendet`;
    }
  }

  function render(){
    if(isAdmin){ renderAdmin(); }
    else{ renderGuest(); }
  }

  function addTrackLocally(track){
    if(tracks.some(t => t.id === track.id)) return;
    tracks.push(track);
    render();
  }

  function applyAdminAction(action){
    if(action.type === 'set-limit'){
      globalLimit = action.limit;
    }else if(action.type === 'reset-pin'){
      pinByName[nameKey(action.name)] = action.newPin;
      // If it's the currently logged-in user (matched by name), force them to re-login
      if(!isAdmin && currentName && nameKey(currentName) === nameKey(action.name) && currentPin !== action.newPin){
        currentName = null;
        currentPin = null;
        localStorage.removeItem(STORAGE_KEY);
        loginScreen.style.display = 'flex';
        whoami.style.display = 'none';
        loginError.textContent = 'Deine PIN wurde vom Gastgeber zurückgesetzt. Bitte neu anmelden.';
      }
    }else if(action.type === 'grant-bonus'){
      bonusGrants.push({
        id: action.id,
        nameLower: nameKey(action.name),
        bonusPin: action.bonusPin,
        bonusCount: action.bonusCount,
        ts: action.ts,
        usedBy: []
      });
    }else if(action.type === 'use-bonus'){
      const grant = bonusGrants.find(g => g.id === action.grantId);
      if(grant && !grant.usedBy.includes(action.guestKey)){
        grant.usedBy.push(action.guestKey);
      }
    }
    render();
  }

  // --- Login flow ---
  function tryLogin(){
    const name = nameInput.value.trim();
    const pin = pinInput.value.trim();
    if(!name){
      loginError.textContent = 'Bitte gib deinen Namen ein.';
      return;
    }
    if(!/^\d{4}$/.test(pin)){
      loginError.textContent = 'Die PIN muss aus genau 4 Ziffern bestehen.';
      return;
    }
    currentName = name;
    currentPin = pin;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ name, pin }));
    loginScreen.style.display = 'none';
    whoami.style.display = 'block';
    loginError.textContent = '';
    updateWhoami();
    render();
  }

  function updateWhoami(){
    if(isAdmin) return;
    whoami.innerHTML = `Angemeldet als <strong>${escapeHtml(currentName)}</strong> · <button id="switchUserBtn">nicht du?</button>`;
    document.getElementById('switchUserBtn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      currentName = null;
      currentPin = null;
      nameInput.value = '';
      pinInput.value = '';
      loginError.textContent = '';
      loginScreen.style.display = 'flex';
      whoami.style.display = 'none';
    });
  }

  loginBtn.addEventListener('click', tryLogin);
  pinInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryLogin(); });
  pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/\D/g, '').slice(0,4);
  });

  if(!isAdmin){
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      try{
        const parsed = JSON.parse(saved);
        if(parsed.name && parsed.pin){
          currentName = parsed.name;
          currentPin = parsed.pin;
          nameInput.value = parsed.name;
          pinInput.value = parsed.pin;
          loginScreen.style.display = 'none';
          whoami.style.display = 'block';
          updateWhoami();
        }
      }catch(e){ /* ignore */ }
    }
  }

  // --- Add track sheet ---
  let unlockedGrantId = null; // grant used to unlock this session's extra add

  function openSheet(){
    unlockedGrantId = null;
    bonusPinInput.value = '';
    bonusPinInput.style.outline = '';

    if(currentName){
      const mineCount = tracks.filter(t => guestKey(t.guestName, t.guestPin) === guestKey(currentName, currentPin)).length;
      const limit = getEffectiveLimitFor(currentName, currentPin);
      if(mineCount >= limit){
        bonusStep.classList.remove('hidden');
        songStep.classList.add('hidden');
        overlay.classList.add('open');
        bonusPinInput.focus();
        return;
      }
    }
    bonusStep.classList.add('hidden');
    songStep.classList.remove('hidden');
    overlay.classList.add('open');
    titleInput.focus();
  }

  function closeSheet(){
    overlay.classList.remove('open');
    titleInput.value = '';
    artistInput.value = '';
    bonusPinInput.value = '';
    bonusStep.classList.add('hidden');
    songStep.classList.remove('hidden');
    unlockedGrantId = null;
  }

  fabBtn.addEventListener('click', openSheet);
  cancelBtn.addEventListener('click', closeSheet);
  bonusCancelBtn.addEventListener('click', closeSheet);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeSheet(); });

  bonusConfirmBtn.addEventListener('click', () => {
    const enteredBonusPin = bonusPinInput.value.trim();
    const matchingGrant = bonusGrants.find(g =>
      g.nameLower === nameKey(currentName) &&
      g.bonusPin === enteredBonusPin &&
      !g.usedBy.includes(guestKey(currentName, currentPin))
    );
    if(!matchingGrant){
      bonusPinInput.style.outline = '2px solid var(--clay)';
      return;
    }
    unlockedGrantId = matchingGrant.id;
    bonusStep.classList.add('hidden');
    songStep.classList.remove('hidden');
    titleInput.focus();
  });

  let ably, channel;

  confirmBtn.addEventListener('click', () => {
    const title = titleInput.value.trim();
    const artist = artistInput.value.trim();
    if(!title || !artist){
      titleInput.style.outline = !title ? '2px solid var(--clay)' : '';
      artistInput.style.outline = !artist ? '2px solid var(--clay)' : '';
      return;
    }
    if(!currentName || !currentPin){
      closeSheet();
      loginScreen.style.display = 'flex';
      return;
    }

    const mineCount = tracks.filter(t => guestKey(t.guestName, t.guestPin) === guestKey(currentName, currentPin)).length;
    const limit = getEffectiveLimitFor(currentName, currentPin);

    if(mineCount >= limit && !unlockedGrantId){
      // Limit reached again and no valid unlock this session — send back to PIN step
      closeSheet();
      openSheet();
      return;
    }

    const usedGrantId = unlockedGrantId;

    const track = {
      id: 'trk_' + Math.random().toString(36).slice(2,10) + '_' + Date.now(),
      title,
      artist,
      ts: Date.now(),
      guestName: currentName,
      guestPin: currentPin
    };
    addTrackLocally(track);
    closeSheet();

    if(channel){
      channel.publish('new-track', track, (err) => {
        if(err){
          statusBar.textContent = 'Konnte nicht senden – bitte Verbindung prüfen';
        }
      });
      if(usedGrantId){
        const action = {
          type: 'use-bonus',
          grantId: usedGrantId,
          guestKey: guestKey(currentName, currentPin),
          ts: Date.now()
        };
        applyAdminAction(action);
        channel.publish('admin-action', action);
      }
    }
  });

  function initAbly(){
    try{
      ably = new Ably.Realtime({ key: ABLY_KEY });
    }catch(e){
      statusBar.textContent = 'Ably konnte nicht geladen werden';
      return;
    }

    ably.connection.on('connected', () => {
      statusBar.textContent = 'live verbunden';
      setTimeout(()=>{ if(statusBar.textContent === 'live verbunden') statusBar.textContent = ''; }, 2000);
    });
    ably.connection.on('disconnected', () => {
      statusBar.textContent = 'Verbindung unterbrochen – versuche erneut …';
    });
    ably.connection.on('failed', () => {
      statusBar.textContent = 'Verbindung fehlgeschlagen';
    });

    channel = ably.channels.get(CHANNEL_NAME);

    channel.subscribe('new-track', (msg) => {
      addTrackLocally(msg.data);
    });
    channel.subscribe('admin-action', (msg) => {
      applyAdminAction(msg.data);
    });

    function loadHistory(){
      channel.history((err, page) => {
        if(err){
          statusBar.textContent = 'Verlauf konnte nicht geladen werden';
          return;
        }
        const historyTracks = [];
        const historyActions = [];
        const collect = (p) => {
          p.items.forEach(item => {
            if(item.name === 'new-track') historyTracks.push(item.data);
            if(item.name === 'admin-action') historyActions.push(item.data);
          });
          if(p.hasNext()){
            p.next((e, nextPage) => { if(!e) collect(nextPage); });
          }
        };
        collect(page);
        historyTracks.forEach(addTrackLocally);
        historyActions.sort((a,b) => (a.ts||0) - (b.ts||0));
        historyActions.forEach(applyAdminAction);
      });
    }

    // Explicitly attach before loading history — avoids the untilAttach race
    // that can leave history empty if the channel isn't attached yet.
    channel.attach((err) => {
      if(err){
        statusBar.textContent = 'Konnte keine Verbindung zum Kanal herstellen';
        return;
      }
      loadHistory();
    });
  }

  render();

  if(typeof Ably === 'undefined'){
    statusBar.textContent = 'Ably lädt noch …';
    let attempts = 0;
    const waitForAbly = setInterval(() => {
      attempts++;
      if(typeof Ably !== 'undefined'){
        clearInterval(waitForAbly);
        initAbly();
      }else if(attempts > 40){
        clearInterval(waitForAbly);
        statusBar.textContent = 'Ably nicht verfügbar – neu laden versuchen';
      }
    }, 150);
  }else{
    initAbly();
  }
})();
</script>
</body>
